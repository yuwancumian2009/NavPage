<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="导航">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#334155" stroke-width="2"/>
  <g filter="url(#glow)"><rect x="26" y="26" width="32" height="32" rx="9" fill="url(#hi)"/></g>
  <rect x="70" y="26" width="32" height="32" rx="9" fill="#cbd5e1"/>
  <rect x="26" y="70" width="32" height="32" rx="9" fill="#94a3b8"/>
  <rect x="70" y="70" width="32" height="32" rx="9" fill="#64748b"/>
</svg>
