name: image

# 构建并推送镜像到 Docker Hub，部署端 `docker compose pull` 即可，不用在 NAS 上编译。
# 触发：main 分支、v* 标签、或手动 workflow_dispatch。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # buildx 的 type=gha 缓存要写 Actions cache；只在上面留 contents:read 会把缓存写入挡掉。
  actions: write

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/navpage
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # 依赖全是纯 Python（fastapi/uvicorn/httpx/python-multipart），
          # arm64 走模拟构建也很便宜，NAS（amd64）和 ARM 云主机用同一个 tag。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
